<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">
<title>Color spaces — 0colors</title>
<style>
:root { color-scheme: light dark; --bg: #ffffff; --ink: #202229; --muted: #626773; --faint: #8a909a; --line: #e5e7eb; --soft: #f6f7f9; --raised: #ffffff; --blue: #356bd9; --purple: #7756b6; --teal: #16766a; --shadow: 0 6px 18px #1620340a; }
@media (prefers-color-scheme: dark) { :root { --bg: #202126; --ink: #f1f2f5; --muted: #a5a8b4; --faint: #797e8d; --line: #393c45; --soft: #282a31; --raised: #30333b; --blue: #8cb2ff; --purple: #c5a2f1; --teal: #7ad6c6; --shadow: 0 6px 18px #00000018; } }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; }
body { color: var(--ink); background: var(--bg); font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
h1, h2, h3, p { margin: 0; }
svg { display: block; overflow: visible; }
code, kbd, .mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; }
.kicker { color: var(--muted); font-size: 10px; font-weight: 650; letter-spacing: .15em; text-transform: uppercase; }
.lesson { height: 100%; padding: 28px 32px; display: grid; grid-template-columns: 310px 1fr; gap: 32px; align-items: center; }
.lesson h1 { font-size: 32px; line-height: 1.12; font-weight: 650; letter-spacing: -.045em; margin: 12px 0; }
.lesson .intro { font-size: 13.5px; line-height: 1.65; color: var(--muted); max-width: 298px; }
.panel { border: 1px solid var(--line); border-radius: 14px; background: var(--soft); }
.small { font-size: 11px; line-height: 1.55; color: var(--muted); }
.ref { color: var(--blue); }
.kw { color: var(--purple); }
.fn { color: var(--teal); }
.comment { color: var(--faint); }
.local { font-family: Georgia, serif; font-style: italic; }

.comparison { display: grid; grid-template-columns: 96px repeat(4, 1fr); grid-template-rows: 22px 96px 96px; align-items: center; justify-items: center; gap: 6px 8px; padding: 12px 18px; }
.comparison .hue { font-size: 10px; color: var(--muted); }
.row-label { justify-self: start; font-size: 12px; font-weight: 600; line-height: 1.6; }
.row-label span { display: block; font-size: 10px; font-weight: 400; color: var(--muted); }
.swatch { width: 64px; height: 64px; border-radius: 50%; box-shadow: inset 0 0 0 1px #0000000d; }
.space-labels { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
.space-labels code { padding: 4px 6px; border: 1px solid var(--line); border-radius: 5px; color: var(--muted); font-size: 9px; }
</style>
</head>
<body>
<main class="lesson">
  <div><div class="kicker">01 / The coordinates of color</div><h1>Same lightness.<br>Different light.</h1><p class="intro">HSL gives these hues the same number. OKLCH makes them look much more even. Choose the space that fits the decision.</p><div class="space-labels"><code>OKLCH</code><code>HCT</code><code>HSL</code><code>RGB</code></div></div>
  <div class="comparison panel" role="img" aria-label="HSL at lightness 50: yellow and green look bright, blue and purple look dark. OKLCH at lightness 70: the four hues look more evenly light.">
    <span></span><span class="hue">Yellow</span><span class="hue">Green</span><span class="hue">Blue</span><span class="hue">Purple</span>
    <div class="row-label">HSL<span class="mono">L 50 · S 90</span></div>
    <div class="swatch" style="background:hsl(60 90% 50%)"></div><div class="swatch" style="background:hsl(120 90% 50%)"></div><div class="swatch" style="background:hsl(230 90% 50%)"></div><div class="swatch" style="background:hsl(280 90% 50%)"></div>
    <div class="row-label">OKLCH<span class="mono">L 70 · C .13</span></div>
    <div class="swatch" style="background:oklch(70% .13 100)"></div><div class="swatch" style="background:oklch(70% .13 145)"></div><div class="swatch" style="background:oklch(70% .13 255)"></div><div class="swatch" style="background:oklch(70% .13 305)"></div>
  </div>
</main>
</body>
</html>
